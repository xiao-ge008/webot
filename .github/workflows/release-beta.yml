name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. beta1.0 or v1.0.1)
        required: true
        default: v1.0.1
  push:
    tags:
      - 'beta*'
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build OpenFang (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p openfang-cli --release
        working-directory: vendor/openfang
        shell: bash

      - name: Stage OpenFang (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p apps/frontend/src-tauri/resources/openfang/win
          cp vendor/openfang/target/release/openfang.exe apps/frontend/src-tauri/resources/openfang/openfang.exe
          cp vendor/openfang/target/release/openfang.exe apps/frontend/src-tauri/resources/openfang/win/openfang.exe
        shell: bash

      - name: Build OpenFang (macOS)
        if: runner.os == 'macOS'
        run: cargo build -p openfang-cli --release
        working-directory: vendor/openfang
        shell: bash

      - name: Stage OpenFang (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH="$(uname -m)"
          DEST="apps/frontend/src-tauri/resources/openfang/macos-${ARCH}"
          mkdir -p "$DEST"
          cp vendor/openfang/target/release/openfang "$DEST/openfang"
          chmod +x "$DEST/openfang"
        shell: bash

      - name: Build Tauri (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles msi
        working-directory: apps/frontend
        shell: bash

      - name: Build Tauri (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --bundles app
          ARCH="$(uname -m)"
          APP_PATH="src-tauri/target/release/bundle/macos/WeBot.app"
          ZIP_PATH="src-tauri/target/release/bundle/macos/WeBot_${ARCH}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
        working-directory: apps/frontend
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: apps/frontend/src-tauri/target/release/bundle/**

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List dist
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: main
          files: |
            dist/**/msi/*.msi
            dist/**/macos/*.app.zip
          fail_on_unmatched_files: false
