name: Release Beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. beta1.0)
        required: true
        default: beta1.0
  push:
    tags:
      - 'beta*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles msi
        working-directory: apps/frontend
        shell: bash

      - name: Build Tauri (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg,app
        working-directory: apps/frontend
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: apps/frontend/src-tauri/target/release/bundle/**

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: main
          files: |
            dist/**/bundle/msi/*.msi
            dist/**/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
